name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            target/movie-booking-0.0.1-SNAPSHOT.jar \
            ubuntu@$HOST:/home/ubuntu/movie-booking/target/
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@$HOST \
            "pkill -f 'movie-booking' || true; cd /home/ubuntu/movie-booking; set -a && source .env && set +a; nohup java -jar target/movie-booking-0.0.1-SNAPSHOT.jar > app.log 2>&1 &"
          rm -f private_key.pem